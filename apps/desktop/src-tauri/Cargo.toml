[package]
name = "cupcakeagi-desktop-host"
version = "2.0.0-rc.1"
description = "Windows Tauri host for CupcakeAI"
authors = ["CupcakeAI contributors"]
edition = "2021"
license = "Unlicense"
rust-version = "1.77.2"

[lib]
name = "cupcakeagi_desktop_host"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "CupcakeAI"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cupcake-tool-broker = { path = "../../../crates/tool-broker" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = { version = "2.7.2", default-features = false }
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
url = "2.5"
uuid = { version = "1.11", features = ["serde", "v7"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
