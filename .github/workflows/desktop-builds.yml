name: Windows installer build

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-builds.yml'
      - 'apps/desktop/**'
      - 'crates/tool-broker/**'
      - 'services/runtime/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
  push:
    branches: [main, master, 'feat/**']
    paths:
      - '.github/workflows/desktop-builds.yml'
      - 'apps/desktop/**'
      - 'crates/tool-broker/**'
      - 'services/runtime/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64-package:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/runtime/pyproject.toml
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: node scripts/ci/install-js.mjs
      - run: >-
          python -m pip install --disable-pip-version-check -e
          "services/runtime[documents,durability,providers,sqlcipher]" pyinstaller==6.22.2
      - run: node scripts/package-sidecars.mjs
      - run: pnpm --filter @cupcakeagi/desktop bundle:nsis
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Cupcake-Chat-Windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
