name: Cupcake Chat Windows draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version already present in every manifest
        required: true
        default: '1.8.0'
        type: string

permissions:
  contents: write

concurrency:
  group: cupcake-chat-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  windows-x64-draft:
    name: Sign and prepare Windows x64 draft
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/runtime/pyproject.toml
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: node scripts/ci/install-js.mjs
      - run: node scripts/assert-release-version.mjs "${{ inputs.version }}"
      - name: Require updater signing configuration
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $required = @(
            'TAURI_UPDATER_PUBLIC_KEY',
            'TAURI_SIGNING_PRIVATE_KEY'
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) { throw "Missing release configuration: $($missing -join ', ')" }
      - name: Write runner-only Tauri config
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $certificateValues = @(
            $env:WINDOWS_CERTIFICATE,
            $env:WINDOWS_CERTIFICATE_PASSWORD,
            $env:WINDOWS_TIMESTAMP_URL
          )
          $certificateValueCount = @($certificateValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($certificateValueCount -ne 0 -and $certificateValueCount -ne 3) {
            throw 'Authenticode requires WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD, and WINDOWS_TIMESTAMP_URL together'
          }
          $bundle = @{ createUpdaterArtifacts = $true }
          if ($certificateValueCount -eq 3) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'cupcake-chat-release.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            try {
              $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
              if (-not $certificate.Thumbprint) { throw 'The Authenticode certificate has no thumbprint' }
              $bundle.windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                tsp = $true
              }
            } finally {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            }
            "AUTHENTICODE_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            @(
              '### Windows signing',
              '',
              'The draft NSIS installer is Authenticode signed and timestamped.'
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            "AUTHENTICODE_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            @(
              '### Windows signing',
              '',
              'The draft has a required Tauri updater signature but no optional Authenticode signature. Do not publish it as a trusted public Windows release until that tradeoff is reviewed.'
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          $config = @{
            bundle = $bundle
          }
          $configPath = Join-Path $env:RUNNER_TEMP 'cupcake-chat-release.conf.json'
          $config | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM
          "TAURI_RELEASE_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: >-
          python -m pip install --disable-pip-version-check -e
          "services/runtime[documents,durability,providers,sqlcipher]" pyinstaller==6.22.2
      - run: node scripts/package-sidecars.mjs
      - run: node scripts/verify.mjs --lane rust
      - name: Build signed updater and create draft release
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUPCAKE_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --bundles nsis --config "${{ env.TAURI_RELEASE_CONFIG }}"
          tagName: v__VERSION__
          releaseName: Cupcake Chat v__VERSION__
          releaseBody:
            Updater-signed Windows x64 release candidate. Review the installer evidence before
            publishing this draft.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
      - run:
          node scripts/release-candidate-audit.mjs --require-artifacts --require-updater-artifacts
      - if: env.AUTHENTICODE_ENABLED == 'true'
        run:
          node scripts/release-candidate-audit.mjs --require-artifacts --require-updater-artifacts
          --require-authenticode
