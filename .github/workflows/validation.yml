name: Validation

on:
  # Maintainers run the full suite locally; hosted validation is opt-in.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/ci/install-js.mjs
      - run: node scripts/verify.mjs --lane js

  contracts:
    name: Cross-language contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/ci/install-js.mjs
      - run: node scripts/verify.mjs --lane contracts

  python:
    name: Python lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/runtime/pyproject.toml
      - run: python scripts/ci/install-python.py
      - run: node scripts/verify.mjs --lane python

  rust:
    name: Rust broker and Tauri host
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: node scripts/verify.mjs --lane rust
